# Builds the Windows, macOS and Linux downloads and attaches them to a GitHub Release.
# Use: push a tag such as v1.3.17  (git tag v1.3.17 && git push origin v1.3.17)
name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis portable --publish never
          - os: macos-latest
            cmd: npx electron-builder --mac dmg --publish never
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage deb tar.gz --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
